name: Deploy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@just
      - name: Run secret preflight
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            FROM="${{ github.event.pull_request.base.sha }}"
            TO="${{ github.event.pull_request.head.sha }}"
          else
            FROM="${{ github.event.before }}"
            TO="${{ github.sha }}"
          fi
          just secrets-preflight-range "$FROM" "$TO"

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    outputs:
      extension_impact: ${{ steps.impact.outputs.extensionImpact }}
      extension_version_changed: ${{ steps.extension-version-policy.outputs.versionChanged }}
      extension_next_version: ${{ steps.extension-version-policy.outputs.nextVersion }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Impact detection runs before the heavy toolchain setup, so a change that needs neither the
      # database nor the functions can skip installing Deno and the Supabase CLI along with the
      # lanes that need them. change-impact.cjs uses only Node built-ins and git, so it runs
      # before `npm ci`.
      - name: Detect change impact
        id: impact
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            {
              echo "dbImpact=true"
              echo "webImpact=true"
              echo "extensionImpact=true"
              echo "functionsImpact=true"
              echo "docsOnly=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            FROM="${{ github.event.pull_request.base.sha }}"
            TO="${{ github.event.pull_request.head.sha }}"
          else
            FROM="${{ github.event.before }}"
            TO="${{ github.sha }}"
          fi

          node scripts/just/change-impact.cjs --from "$FROM" --to "$TO" --format github-output --output-file "$GITHUB_OUTPUT"
      # This job runs the full Supabase stack, a Next production build, the
      # extension build, Playwright + e2e, and a multi-GB Docker image export on
      # one standard runner (~14 GB free). It has hit "no space left on device"
      # exporting images, and `supabase db reset` has failed restarting
      # containers. Reclaiming the preinstalled toolchains nothing here uses
      # buys roughly 20-30 GB. `df` is printed so a future disk failure is
      # diagnosable from the log rather than inferred.
      - name: Free disk space
        shell: bash
        run: |
          echo "Before:"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL || true
          echo "After:"
          df -h /
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # No supabase/setup-cli here, on purpose. Every `supabase` invocation in this job goes
      # through `npx supabase`, which runs the package `npm ci` installs from package-lock.json;
      # the action's binary on PATH was never the one that ran. The action also resolved
      # `version: latest` through an anonymous GitHub API call whose per-IP limit is shared by
      # every hosted runner, and run 317 lost its production database deploy to
      # `rate limit exceeded` there. The npm package ships the binary as a platform
      # optionalDependency from the registry, so the CLI is provisioned with no GitHub call at
      # all, at the version the lockfile records (T-260903-ut8).
      - uses: taiki-e/install-action@just
      - name: Install dependencies
        run: npm ci
      - name: Detect extension release policy
        id: extension-version-policy
        shell: bash
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="$(node -p "require('./browserExtension/manifest.json').version")"
            {
              echo "versionChanged=true"
              echo "requiresVersionBump=false"
              echo "previousVersion=$VERSION"
              echo "nextVersion=$VERSION"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            FROM="${{ github.event.pull_request.base.sha }}"
            TO="${{ github.event.pull_request.head.sha }}"
          else
            FROM="${{ github.event.before }}"
            TO="${{ github.sha }}"
          fi

          # On a push to main the publish decision is taken against what is actually published, not
          # against the previous commit, so a publish that failed is retried by the next push
          # instead of being skipped forever as "version unchanged". T-260901-0dr. The bucket is
          # public, so this reads latest.json with no key; an unreachable Storage falls back to the
          # commit-range comparison rather than publishing on every push.
          #
          # Pull requests keep the commit-range comparison. They never publish, and comparing
          # against production there would build the release bundle on every one of them.
          PUBLISHED_ARGS=()
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" && -n "$SUPABASE_PROJECT_REF" ]]; then
            PUBLISHED_ARGS=(--supabase-url "https://${SUPABASE_PROJECT_REF}.supabase.co")
          fi

          npx tsx scripts/extension/release.ts check-version-bump --from "$FROM" --to "$TO" "${PUBLISHED_ARGS[@]}" --format github-output --output-file "$GITHUB_OUTPUT"
      - name: Enforce extension manifest version bump
        if: steps.extension-version-policy.outputs.requiresVersionBump == 'true'
        shell: bash
        run: |
          echo "Extension release surfaces changed without a browserExtension/manifest.json version bump."
          exit 1
      - name: Run quality (format, lint, typecheck)
        # The migration-order gate inside `quality` compares against the state this change is added
        # to. Pull requests may target any branch here, so that is the pull request's own base
        # rather than a hard-coded main. On a push it is the commit the branch pointed at before,
        # the same range basis the impact and extension-version checks above use: origin/main after
        # checkout is the commit being pushed, so comparing against it would compare the migration
        # directory with itself and report no additions, in the one run that also deploys. An empty
        # value (workflow_dispatch), or the zero sha of a branch's first push, falls back to
        # origin/main.
        #
        # The PR-size gate takes the same base, for the same reasons, and additionally the head
        # branch name: a pull request run checks out a detached merge commit, where git names no
        # branch and a `branch` allowlist entry could never match.
        #
        # A pull-request verdict is evidence about the base as it stood when the event fired, and a
        # commit landing on the base fires no pull_request event, so on its own it expires the
        # moment anything else merges. What makes it bind is the `main protection` ruleset, which
        # requires the branch to be up to date with `main` before it can merge: a merge to `main`
        # puts every open pull request behind, and each one has to take the new tip and re-run this
        # before it can go in. The base this run measures against is therefore the base it merges
        # onto. (A merge queue would give the same guarantee and is not available here: GitHub
        # offers it to organisation-owned repositories only.)
        env:
          MIGRATION_ORDER_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          PR_SIZE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          PR_SIZE_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: just quality
      - name: Restore Supabase Docker image cache
        if: steps.impact.outputs.dbImpact == 'true'
        id: supabase-image-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/docker/supabase-images
          key: ${{ runner.os }}-supabase-docker-${{ hashFiles('supabase/config.toml') }}
      - name: Load cached Supabase Docker image
        if: steps.impact.outputs.dbImpact == 'true'
        shell: bash
        run: |
          mkdir -p .cache/docker/supabase-images
          shopt -s nullglob
          archives=(.cache/docker/supabase-images/*.tar.gz)
          if [[ ${#archives[@]} -gt 0 ]]; then
            for archive in "${archives[@]}"; do
              gzip -dc "$archive" | docker load
            done
          fi
      - name: Start Supabase
        if: steps.impact.outputs.dbImpact == 'true'
        env:
          HEALTH_STRUCTURE_PARSER_MODE: e2e_stub
          OPENROUTER_API_KEY: e2e-local-disabled
        run: just supabase-local-start
      - name: Capture Supabase Docker images
        if: steps.impact.outputs.dbImpact == 'true'
        shell: bash
        run: |
          mkdir -p .cache/docker
          docker ps --format '{{.Image}}' | sort -u > .cache/docker/supabase-images.txt
      # The runner ships pg_dump 16, which fails twice over: it refuses the 17 server that
      # supabase/config.toml pins, and it does not know --no-policies, which the snapshot is
      # defined with and which arrived in pg_dump 18. Without a client clearing both bars the
      # snapshot is never written -- exactly how this check passed for weeks while regenerating
      # nothing. The two bars are read rather than pinned twice: the server major comes from the
      # config, the flag floor from the script.
      - name: Install pg_dump for the artifact snapshot
        if: steps.impact.outputs.dbImpact == 'true'
        shell: bash
        run: |
          set -euo pipefail
          server="$(grep -oPm1 '^\s*major_version\s*=\s*\K\d+' supabase/config.toml)"
          floor="$(grep -oPm1 'MIN_PG_DUMP_MAJOR\s*=\s*\K\d+' scripts/just/db-artifacts.cjs)"
          major=$(( server > floor ? server : floor ))
          echo "database pinned to ${server}, snapshot flags need ${floor}: installing client ${major}"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "postgresql-client-${major}"
          echo "/usr/lib/postgresql/${major}/bin" >> "$GITHUB_PATH"
      - name: Verify generated DB artifacts
        if: steps.impact.outputs.dbImpact == 'true'
        env:
          SUPABASE_ALREADY_RUNNING: "1"
        run: node scripts/just/db-artifacts.cjs --verify
      - name: Build and DB checks
        if: steps.impact.outputs.dbImpact == 'true'
        env:
          SUPABASE_ALREADY_RUNNING: "1"
        run: node scripts/just/build-local-all.cjs --db-mode=always
      - name: Build (without DB lifecycle)
        if: steps.impact.outputs.dbImpact != 'true'
        run: node scripts/just/build-local-all.cjs --db-mode=skip
      - name: Install Playwright browser
        if: steps.impact.outputs.webImpact == 'true' || steps.impact.outputs.dbImpact == 'true' || steps.impact.outputs.functionsImpact == 'true'
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        if: steps.impact.outputs.webImpact == 'true' || steps.impact.outputs.dbImpact == 'true' || steps.impact.outputs.functionsImpact == 'true'
        run: just test-e2e
      - name: Bundle Supabase Docker images
        if: steps.impact.outputs.dbImpact == 'true' && steps.supabase-image-cache.outputs.cache-hit != 'true'
        id: supabase-image-bundle
        shell: bash
        run: |
          if [[ -s .cache/docker/supabase-images.txt ]]; then
            mkdir -p .cache/docker/supabase-images
            rm -f .cache/docker/supabase-images/*.tar.gz
            ready=false

            while IFS= read -r image; do
              [[ -n "$image" ]] || continue
              image_hash="$(printf '%s' "$image" | sha256sum | cut -d' ' -f1)"
              if ! docker save "$image" | gzip -1 > ".cache/docker/supabase-images/${image_hash}.tar.gz"; then
                # Populating this cache only speeds up later runs — it is not a
                # quality gate, and it runs after every real check has passed.
                # Letting it fail the job (usually because the runner filled up
                # while exporting several GB of images) reports a red build for
                # green code, and also skips "Test and coverage" below.
                # Drop the partial bundle so the save step is skipped rather
                # than caching an incomplete set, and free the disk again.
                echo "::warning::Supabase image cache not populated: failed to bundle ${image}"
                rm -f .cache/docker/supabase-images/*.tar.gz
                ready=false
                break
              fi
              ready=true
            done < .cache/docker/supabase-images.txt

            echo "ready=$ready" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Stop Supabase
        if: always() && steps.impact.outputs.dbImpact == 'true'
        run: just supabase-local-stop
      - name: Save Supabase Docker image cache
        if: always() && steps.impact.outputs.dbImpact == 'true' && steps.supabase-image-cache.outputs.cache-hit != 'true' && steps.supabase-image-bundle.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/docker/supabase-images
          key: ${{ steps.supabase-image-cache.outputs.cache-primary-key }}
      - name: Test and coverage
        run: just test-unit-coverage && just coverage-check

  extension-release-bundle:
    needs: [secrets-scan, quality-gates]
    if: needs.quality-gates.outputs.extension_version_changed == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    name: Extension Release Bundle
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_ORIGIN: ${{ vars.NEXT_PUBLIC_APP_ORIGIN }}
      NEXT_PUBLIC_APP_ORIGINS: ${{ vars.NEXT_PUBLIC_APP_ORIGINS }}
      NEXT_PUBLIC_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@just
      - name: Install dependencies
        run: npm ci
      - name: Skip extension bundle when manifest version is unchanged
        if: needs.quality-gates.outputs.extension_version_changed != 'true'
        run: echo "Extension manifest version unchanged; skipping release bundle build."
      - name: Build versioned extension release bundle
        if: needs.quality-gates.outputs.extension_version_changed == 'true'
        run: just extension-release-build
      - name: Upload extension release artifact
        if: needs.quality-gates.outputs.extension_version_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-release-${{ needs.quality-gates.outputs.extension_next_version }}
          path: .artifacts/extension-release
          if-no-files-found: error

  publish-extension-release:
    # After deploy-supabase, not before it: the publish uploads into a Storage bucket that
    # `20260314000000_extension_release_bucket.sql` creates, and that migration is applied by
    # deploy-supabase. The old order ran the upload first, which only worked because the bucket
    # already existed in the live project.
    needs: [secrets-scan, quality-gates, extension-release-bundle, deploy-supabase]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Publish Extension Release
    environment: production
    # Serialised per release version, not globally. Two runs uploading the same
    # version are the double-write worth preventing, and they queue here; two
    # runs uploading different versions are kept apart by the guard in
    # `publishPreparedExtensionRelease`, which re-reads the published version
    # through the authenticated Storage API immediately before writing.
    #
    # A single global group would have been worse than none: GitHub keeps at most
    # one running and one pending job per group, and a new entrant replaces the
    # pending one even with `cancel-in-progress: false`. Re-running an old 0.1.2
    # workflow would then displace a pending 0.1.4, which would refuse its own
    # upload and leave 0.1.4 unpublished until someone pushed again. Keying the
    # group by version means an older run can only ever displace itself.
    concurrency:
      group: publish-extension-release-${{ needs.quality-gates.outputs.extension_next_version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_ORIGIN: ${{ vars.NEXT_PUBLIC_APP_ORIGIN }}
      NEXT_PUBLIC_APP_ORIGINS: ${{ vars.NEXT_PUBLIC_APP_ORIGINS }}
      NEXT_PUBLIC_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PRODUCTION_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@just
      - name: Install dependencies
        run: npm ci
      - name: Skip extension release publish when manifest version is unchanged
        if: needs.quality-gates.outputs.extension_version_changed != 'true'
        run: echo "Extension manifest version unchanged; skipping release publish."
      - name: Download extension release artifact
        if: needs.quality-gates.outputs.extension_version_changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: chrome-extension-release-${{ needs.quality-gates.outputs.extension_next_version }}
          path: .artifacts/extension-release
      - name: Publish extension release to Supabase Storage
        if: needs.quality-gates.outputs.extension_version_changed == 'true'
        run: just extension-release-publish

  deploy-vercel-production:
    # Not gated on the extension publish. Publishing a browser extension is an optional artifact
    # of a release; on 2026-08-31 its failure on an unset secret skipped both production deploys
    # for a merge that carried nothing either of them would have shipped. T-260901-w78.
    needs: [secrets-scan, quality-gates]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Deploy Vercel Production
    environment: production
    # Serialised, because the production alias lands on whichever run finishes last rather than
    # on the newest commit. On 2026-09-02 four merges a minute apart ran four deploys at once and
    # the oldest finished last, so private-orbit.vercel.app served a build three merges behind
    # main with every job green and nothing reporting it (T-260902-60d).
    #
    # Its own group, not one shared with deploy-supabase: GitHub holds at most one running and one
    # pending job per group, so a shared group would let a newer run's Supabase job displace this
    # run's pending Vercel job and the commit would never reach the alias at all.
    #
    # The group gives mutual exclusion, not ordering -- see the tip check in the steps below.
    concurrency:
      group: deploy-vercel-production
      cancel-in-progress: false
    # actions: read is for the tip check below, which reads the tip's own run and jobs.
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      # The concurrency group above serialises these deploys but neither orders them nor keeps the
      # newest one: a job joins the queue when its `needs` finish, and the single pending slot goes
      # to the newest arrival, so an older push can arrive after a newer one, displace it, and be
      # the only one left to run. So the run checks here, before it spends a build, whether it is
      # still the tip of `main`; it stands down when a newer commit's own run will deploy, and
      # fails naming that run when the newer commit's deploy was displaced and will not.
      - name: Check this commit is still the tip of main
        id: tip
        uses: ./.github/actions/production-tip-check
        with:
          job: Deploy Vercel Production
      - uses: actions/setup-node@v4
        if: steps.tip.outputs.deploy_sha != ''
        with:
          node-version: 22
      - name: Install Vercel CLI
        if: steps.tip.outputs.deploy_sha != ''
        run: npm install --global vercel@latest
      - name: Pull Vercel Project Settings
        if: steps.tip.outputs.deploy_sha != ''
        run: vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"
      - name: Build Production Artifacts
        if: steps.tip.outputs.deploy_sha != ''
        run: vercel build --prod --token="${VERCEL_TOKEN}"
      - name: Deploy Production
        if: steps.tip.outputs.deploy_sha != ''
        run: vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}"

  deploy-supabase:
    # Same as above, and this is also the job the publish now waits for.
    needs: [secrets-scan, quality-gates]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Deploy Supabase Production
    environment: production
    # Serialised for a different reason than the Vercel job: two overlapping deploys replace the
    # same pg_proc row and Phase 1 dies with `tuple concurrently updated`, which is what killed
    # run 33585250551 (T-260902-60d).
    #
    # A global group is right here although it was wrong for publish-extension-release above. The
    # hazard there is that a displaced pending run leaves a version unpublished for good; here
    # each deploy applies the full desired state of its own commit, so a superseded commit's
    # deploy being cancelled costs nothing -- the newer one that displaced it deploys everything
    # the older one would have.
    #
    # What the group does not give is ordering, and the pending slot holds the newest *arrival*
    # rather than the newest commit -- see the tip check in the steps below.
    #
    # cancel-in-progress stays false: cancelling a running deploy would kill psql partway through
    # the phases, which is the state this task exists to stop production ending up in.
    concurrency:
      group: deploy-supabase-production
      cancel-in-progress: false
    # actions: read is for the tip check below, which reads the tip's own run and jobs.
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      DATABASE_URL: postgresql://postgres.${{ vars.SUPABASE_PROJECT_REF }}:${{ secrets.SUPABASE_DB_PASS }}@aws-1-eu-central-1.pooler.supabase.com:5432/postgres
    steps:
      - uses: actions/checkout@v4
      # Same reason as the Vercel job: the group serialises these deploys without ordering them or
      # keeping the newest, so a push that reached `quality-gates` first can reach the deploy queue
      # second and apply its migrations, functions, policies and version stamp over a newer
      # commit's -- or displace the newer commit's pending deploy altogether. The check stands
      # this run down when the tip's own run will deploy, and fails naming that run when it will not.
      - name: Check this commit is still the tip of main
        id: tip
        uses: ./.github/actions/production-tip-check
        with:
          job: Deploy Supabase Production
      - uses: actions/setup-node@v4
        if: steps.tip.outputs.deploy_sha != ''
        with:
          node-version: 22
      # `npm ci` rather than supabase/setup-cli. deploy-supabase.cjs runs `npx supabase`, and
      # with no local install npx fetched the *current* npm package on every run -- run 332's log
      # says so: "The following package was not found and will be installed: supabase@2.116.0" --
      # while the action's binary sat unused on PATH. So the production deploy ran whatever npm
      # served that day, and the action's `version: latest` lookup, an anonymous GitHub API call,
      # cost run 317 its database deploy with `rate limit exceeded`. Installing from the lockfile
      # makes this job run the CLI version the repository records, the same one a developer's
      # `npx supabase` runs, and reaches GitHub for nothing (T-260903-ut8).
      - name: Install dependencies
        if: steps.tip.outputs.deploy_sha != ''
        run: npm ci
      - uses: taiki-e/install-action@just
        if: steps.tip.outputs.deploy_sha != ''
      - if: steps.tip.outputs.deploy_sha != ''
        run: just ci-deploy-supabase

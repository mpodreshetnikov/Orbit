name: Deploy
on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@just
      - name: Run secret preflight
        run: just secrets-preflight-range "${{ github.event.before }}" "${{ github.sha }}"

  db-artifacts-clean-check:
    name: DB Artifacts Clean Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@just
      - name: Install dependencies
        run: npm ci
      - name: Verify generated DB artifacts
        run: just supabase-local-artifacts-verify

  deploy-vercel-production:
    needs: [secrets-scan, db-artifacts-clean-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Deploy Vercel Production
    environment: production
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Project Settings
        run: vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"
      - name: Build Production Artifacts
        run: vercel build --prod --token="${VERCEL_TOKEN}"
      - name: Deploy Production
        run: vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}"

  deploy-supabase:
    needs: [secrets-scan, db-artifacts-clean-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Deploy Supabase Production
    environment: production
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      DATABASE_URL: postgresql://postgres.${{ vars.SUPABASE_PROJECT_REF }}:${{ secrets.SUPABASE_DB_PASS }}@aws-1-eu-central-1.pooler.supabase.com:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: taiki-e/install-action@just
      - run: just ci-deploy-supabase

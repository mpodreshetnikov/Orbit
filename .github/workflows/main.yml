name: Deploy Supabase
on:
  push:
    branches:
      - main
env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASEACCESSTOKEN }}
  PROJECT_ID: vvriurabgusbdysfrcem
  DATABASE_URL: postgresql://postgres.vvriurabgusbdysfrcem:${{ secrets.SUPABASEDBPASS }}@aws-1-eu-central-1.pooler.supabase.com:5432/postgres

jobs:
  deploy:
    environment: Production - Supabase
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref $PROJECT_ID
      - run: supabase functions deploy 
      - run: supabase db push --yes
      - run: npm run db:deploy

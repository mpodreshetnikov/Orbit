name: Deploy to your server

# Installs Orbit on your own server and keeps it on the latest main, configured entirely by this
# repository's secrets and variables (docs/SELF_HOSTING.md, "Deploy from GitHub"). Does nothing
# until the ORBIT_SERVER_HOST variable is set. The work is deploy/ci/deploy.sh.
on:
  # Every commit on main, once its images are published (deploy-self-hosted in main.yml).
  workflow_call:
  # By hand: Actions -> Deploy to your server -> Run workflow.
  workflow_dispatch:
    inputs:
      action:
        description: "deploy = install or update; restore = then replace the data with the latest backup (a server that replaces a lost one)"
        type: choice
        options: [deploy, restore]
        default: deploy

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to your server
    if: vars.ORBIT_SERVER_HOST != ''
    runs-on: ubuntu-latest
    # One deploy at a time; a newer one waits rather than cancelling one halfway through a migration.
    concurrency:
      group: self-hosted-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        env:
          # Only the secrets a server needs reach this step, by name -- never the whole set, which
          # in this repository also holds the hosted production's tokens. Keep the list in step
          # with docs/SELF_HOSTING.md, "Deploy from GitHub"; any other setting is a variable.
          ORBIT_SECRETS_JSON: >-
            {
              "ORBIT_SSH_PRIVATE_KEY": ${{ toJSON(secrets.ORBIT_SSH_PRIVATE_KEY) }},
              "ORBIT_MASTER_KEY": ${{ toJSON(secrets.ORBIT_MASTER_KEY) }},
              "GOOGLE_CLIENT_SECRET": ${{ toJSON(secrets.GOOGLE_CLIENT_SECRET) }},
              "OPENROUTER_API_KEY": ${{ toJSON(secrets.OPENROUTER_API_KEY) }},
              "WHO_ICD_CLIENT_SECRET": ${{ toJSON(secrets.WHO_ICD_CLIENT_SECRET) }},
              "BACKUP_WAL_S3_ACCESS_KEY_ID": ${{ toJSON(secrets.BACKUP_WAL_S3_ACCESS_KEY_ID) }},
              "BACKUP_WAL_S3_SECRET_ACCESS_KEY": ${{ toJSON(secrets.BACKUP_WAL_S3_SECRET_ACCESS_KEY) }},
              "BACKUP_SNAPSHOT_ACCESS_KEY_ID": ${{ toJSON(secrets.BACKUP_SNAPSHOT_ACCESS_KEY_ID) }},
              "BACKUP_SNAPSHOT_SECRET_ACCESS_KEY": ${{ toJSON(secrets.BACKUP_SNAPSHOT_SECRET_ACCESS_KEY) }},
              "ALERT_TELEGRAM_BOT_TOKEN": ${{ toJSON(secrets.ALERT_TELEGRAM_BOT_TOKEN) }},
              "BACKUP_HEALTHCHECK_URL": ${{ toJSON(secrets.BACKUP_HEALTHCHECK_URL) }},
              "OBS_GRAFANA_CLOUD_OTLP_HEADERS": ${{ toJSON(secrets.OBS_GRAFANA_CLOUD_OTLP_HEADERS) }},
              "POSTGRES_PASSWORD": ${{ toJSON(secrets.POSTGRES_PASSWORD) }},
              "JWT_SECRET": ${{ toJSON(secrets.JWT_SECRET) }},
              "ANON_KEY": ${{ toJSON(secrets.ANON_KEY) }},
              "SERVICE_ROLE_KEY": ${{ toJSON(secrets.SERVICE_ROLE_KEY) }},
              "VAPID_PUBLIC_KEY": ${{ toJSON(secrets.VAPID_PUBLIC_KEY) }},
              "VAPID_PRIVATE_KEY": ${{ toJSON(secrets.VAPID_PRIVATE_KEY) }}
            }
          ORBIT_VARS_JSON: ${{ toJSON(vars) }}
          ORBIT_COMMIT: ${{ github.sha }}
          ORBIT_ACTION: ${{ inputs.action || 'deploy' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: deploy/ci/deploy.sh

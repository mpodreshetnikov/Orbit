name: Deploy to your server

# Installs Orbit on your own server and keeps it on the latest main, configured entirely by this
# repository's secrets and variables, or its production environment's (docs/SELF_HOSTING.md,
# "Deploy from GitHub"). Does nothing until the ORBIT_SERVER_HOST variable is set. The work is
# deploy/ci/deploy.sh.
on:
  # Every commit on main, once its images are published (deploy-self-hosted in main.yml).
  workflow_call:
  # By hand: Actions -> Deploy to your server -> Run workflow.
  workflow_dispatch:
    inputs:
      action:
        description: "deploy = install or update; restore = then replace the data with the latest backup (a server that replaces a lost one); doctor = only show what the server's network reaches, changing nothing; migrate-from-supabase = then replace the data with the hosted Supabase project's (which is only read)"
        type: choice
        options: [deploy, restore, doctor, migrate-from-supabase]
        default: deploy

permissions:
  contents: read
  packages: read
  # The tip check below reads the tip's own run.
  actions: read

jobs:
  deploy:
    name: Deploy to your server
    # The settings may be the repository's or this environment's: with it, the job sees both, an
    # environment's value winning. GitHub creates the environment when it does not exist yet.
    environment: production
    runs-on: ubuntu-latest
    # One deploy at a time; a newer one waits rather than cancelling one halfway through a migration.
    # A doctor run only reads, and has a group of its own: in the deploys' group it would take the
    # single pending slot from a deploy waiting there.
    concurrency:
      group: ${{ inputs.action == 'doctor' && 'self-hosted-doctor' || 'self-hosted-deploy' }}
      cancel-in-progress: false
    steps:
      # Here and not in a job-level `if`, which cannot see an environment's variables.
      - name: Check a server is set up
        id: server
        env:
          HOST: ${{ vars.ORBIT_SERVER_HOST }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ -n "$HOST" ]]; then
            echo "set=true" >>"$GITHUB_OUTPUT"
          elif [[ "$EVENT" == workflow_dispatch ]]; then
            echo "::error::Set the ORBIT_SERVER_HOST variable to your server's IP address, under Settings -> Secrets and variables -> Actions, or in the production environment (docs/SELF_HOSTING.md, Deploy from GitHub)."
            exit 1
          else
            echo "::notice::No server to deploy to: the ORBIT_SERVER_HOST variable is not set."
          fi
      - uses: actions/checkout@v4
        if: steps.server.outputs.set == 'true'
      # From main, the group above gives one deploy at a time but not the newest commit: a slower,
      # older run can arrive last, or displace the newer one's pending job. The same check as the
      # hosted production's deploys: deploy only while this commit is still main's tip (run by hand,
      # the deploy is of whatever was chosen).
      - name: Check this commit is still the tip of main
        id: tip
        if: steps.server.outputs.set == 'true' && github.event_name == 'push'
        uses: ./.github/actions/production-tip-check
        with:
          job: Deploy to your server / Deploy to your server
      - name: Deploy
        if: steps.server.outputs.set == 'true' && (github.event_name != 'push' || steps.tip.outputs.deploy_sha != '')
        env:
          # Only the secrets a server needs reach this step, by name -- never the whole set, which
          # in this repository also holds the hosted production's tokens. Keep the list in step
          # with docs/SELF_HOSTING.md, "Deploy from GitHub"; any other setting is a variable.
          ORBIT_SECRET_ORBIT_SSH_PRIVATE_KEY: ${{ secrets.ORBIT_SSH_PRIVATE_KEY }}
          ORBIT_SECRET_ORBIT_MASTER_KEY: ${{ secrets.ORBIT_MASTER_KEY }}
          ORBIT_SECRET_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ORBIT_SECRET_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ORBIT_SECRET_WHO_ICD_CLIENT_SECRET: ${{ secrets.WHO_ICD_CLIENT_SECRET }}
          ORBIT_SECRET_BACKUP_WAL_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_WAL_S3_ACCESS_KEY_ID }}
          ORBIT_SECRET_BACKUP_WAL_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_WAL_S3_SECRET_ACCESS_KEY }}
          ORBIT_SECRET_BACKUP_SNAPSHOT_ACCESS_KEY_ID: ${{ secrets.BACKUP_SNAPSHOT_ACCESS_KEY_ID }}
          ORBIT_SECRET_BACKUP_SNAPSHOT_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SNAPSHOT_SECRET_ACCESS_KEY }}
          ORBIT_SECRET_ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.ALERT_TELEGRAM_BOT_TOKEN }}
          ORBIT_SECRET_BACKUP_HEALTHCHECK_URL: ${{ secrets.BACKUP_HEALTHCHECK_URL }}
          ORBIT_SECRET_OBS_GRAFANA_CLOUD_OTLP_HEADERS: ${{ secrets.OBS_GRAFANA_CLOUD_OTLP_HEADERS }}
          ORBIT_SECRET_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ORBIT_SECRET_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ORBIT_SECRET_ANON_KEY: ${{ secrets.ANON_KEY }}
          ORBIT_SECRET_SERVICE_ROLE_KEY: ${{ secrets.SERVICE_ROLE_KEY }}
          ORBIT_SECRET_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          ORBIT_SECRET_VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          # The hosted project to move from, for migrate-from-supabase only (docs/SELF_HOSTING.md,
          # "Moving from hosted Supabase"). Without SOURCE_* secrets, the ones this repository's
          # hosted production deploys with (main.yml) stand in.
          SOURCE_DB_URL: ${{ inputs.action == 'migrate-from-supabase' && (secrets.SOURCE_DB_URL || (secrets.SUPABASE_DB_PASS && vars.SUPABASE_PROJECT_REF && format('postgresql://postgres.{0}:{1}@aws-1-eu-central-1.pooler.supabase.com:5432/postgres', vars.SUPABASE_PROJECT_REF, secrets.SUPABASE_DB_PASS))) || '' }}
          SOURCE_SUPABASE_URL: ${{ inputs.action == 'migrate-from-supabase' && (vars.SOURCE_SUPABASE_URL || (vars.SUPABASE_PROJECT_REF && format('https://{0}.supabase.co', vars.SUPABASE_PROJECT_REF))) || '' }}
          SOURCE_SERVICE_ROLE_KEY: ${{ inputs.action == 'migrate-from-supabase' && (secrets.SOURCE_SERVICE_ROLE_KEY || secrets.SUPABASE_PRODUCTION_SERVICE_ROLE_KEY) || '' }}
          ORBIT_VARS_JSON: ${{ toJSON(vars) }}
          ORBIT_COMMIT: ${{ github.sha }}
          ORBIT_ACTION: ${{ inputs.action || 'deploy' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: deploy/ci/deploy.sh

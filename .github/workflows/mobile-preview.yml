# Serves the iOS client to Expo Go from a GitHub runner, so trying it on a phone needs no computer.
#
# Expo Go runs the JavaScript bundle a dev server hands it; it cannot open an EAS Update, which only
# a development build of our own can, and that build needs an Apple Developer membership
# (T-261018-l19 `M6`). Until then this is the cloud stand-in for `just mobile-start`: dispatch it,
# open the `exp://` link it prints in Expo Go, and the runner keeps the server up for the minutes
# asked for. Nothing here deploys anything or writes to the instance.
#
# Needs no secrets: it asks the instance named by the `MOBILE_PREVIEW_INSTANCE` repository variable
# for its public settings (`/.well-known/orbit-instance`, through `scripts/just/mobile-instance.cjs`,
# the same path `just mobile-start <domain>` takes). Not the `production` environment the server
# deploy reads: that one is closed to branches, and a preview exists to run on one.

name: Mobile preview

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep the dev server up (at most 180)"
        type: number
        default: 60
      instance:
        description: "Instance domain; empty uses the MOBILE_PREVIEW_INSTANCE variable"
        type: string
        default: ""

permissions:
  contents: read
  # The address is published as a commit status: job logs and summaries are only readable once the
  # job ends, and this job's whole point is the time before it ends.
  statuses: write

concurrency:
  group: mobile-preview
  cancel-in-progress: true

jobs:
  serve:
    name: Serve to Expo Go
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm --prefix mobile ci
      - name: Point the client at the instance
        env:
          INSTANCE: ${{ inputs.instance || vars.MOBILE_PREVIEW_INSTANCE }}
        run: |
          [[ -n "$INSTANCE" ]] || { echo "::error::Set the MOBILE_PREVIEW_INSTANCE repository variable (the instance's domain), or pass the instance input."; exit 1; }
          node scripts/just/mobile-instance.cjs "$INSTANCE"
      - name: Start the dev server behind a tunnel
        id: serve
        working-directory: mobile
        env:
          CI: "1"
          # Leave mobile/tsconfig.json as committed rather than letting Expo rewrite it on start.
          EXPO_NO_TYPESCRIPT_SETUP: "1"
          # Expo Go opens a tunnelled project only when the CLI serving it is signed in to the same Expo
          # account as the phone. A personal access token, not a robot one: on SDK 57 the tunnel is
          # ngrok's, which refuses a robot user ("Cannot use ngrok with a robot user").
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          [[ -n "$EXPO_TOKEN" ]] || { echo "::error::The EXPO_TOKEN repository secret is not set."; exit 1; }
          nohup npx expo start --tunnel > "$RUNNER_TEMP/expo.log" 2>&1 &
          for _ in $(seq 1 90); do
            # Expo's own tunnel prints its address ("Waiting on http://….on.expo.app", SDK 58 on); Expo
            # Go opens the same host on its own scheme. The local address is skipped.
            url="$(grep -oiE 'waiting on [a-z]+://[^ ]+' "$RUNNER_TEMP/expo.log" | grep -viE '://(localhost|127\.|[0-9.]+:)' | head -1 | sed -E 's#^[Ww]aiting on [a-z]+://#exp://#' || true)"
            [[ -n "$url" ]] && break
            # Through ngrok (SDK 57) it prints only "Tunnel ready." and the local address in CI mode; the
            # ngrok agent's own API names the public host.
            if grep -q 'Tunnel ready' "$RUNNER_TEMP/expo.log"; then
              host="$(curl -sf --max-time 5 http://127.0.0.1:4040/api/tunnels | node -e 'let s="";process.stdin.on("data",(d)=>(s+=d)).on("end",()=>{try{const t=JSON.parse(s).tunnels.find((x)=>x.public_url.startsWith("https://"))??JSON.parse(s).tunnels[0];process.stdout.write(new URL(t.public_url).host)}catch{}})' || true)"
              [[ -n "$host" ]] && { url="exp://$host"; break; }
            fi
            grep -q 'CommandError' "$RUNNER_TEMP/expo.log" && break
            sleep 2
          done
          cat "$RUNNER_TEMP/expo.log"
          [[ -n "$url" ]] || { echo "::error::The tunnel did not come up; the log is above."; exit 1; }
          # Warm the bundle so the first open on the phone does not wait for Metro to compile it.
          curl -sf --max-time 300 -o /dev/null "http://localhost:8081/node_modules/expo-router/entry.bundle?platform=ios&dev=true" || true
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Open in Expo Go"
            echo
            echo "[$url]($url)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Open in Expo Go::$url"
      - name: Publish the address on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.serve.outputs.url }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          minutes="${MINUTES:-60}"
          (( minutes > 180 )) && minutes=180
          until="$(date -u -d "+$minutes minutes" +%H:%M)"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success -f context="Mobile preview" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="$URL until $until UTC" > /dev/null
      - name: Keep serving
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          minutes="${MINUTES:-60}"
          (( minutes > 180 )) && minutes=180
          echo "Serving for $minutes minutes. Cancel the run to stop sooner."
          sleep $(( minutes * 60 ))

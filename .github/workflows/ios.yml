# Builds the iOS app shell on a GitHub-hosted macOS runner, so that shipping it needs no Mac.
#
# Two jobs, deliberately separated by what they require:
#
#   build      compiles the Xcode project with signing switched off. It needs no Apple account and
#              no secrets. This is the only gate in the repository that proves ios/ actually
#              compiles — everything else about the shell is checked by unit tests that never
#              invoke a compiler — but its automatic triggers are commented out for now; see the
#              note above `on:` below.
#
#   testflight archives, signs and uploads. It runs only when someone dispatches it deliberately,
#              because it needs the Apple Developer membership and the App Store Connect
#              credentials, and because a TestFlight upload is not something to do on every push.
#
# macOS minutes are free and unmetered on public repositories, so the cost of the first job is
# wall-clock time on a pull request, not money.

name: iOS

# Temporarily reduced to manual runs only. The `build` job needs no Apple account and was green on
# every run, but the whole iOS lane is parked while enrolment in the Apple Developer Program is
# unresolved: nothing downstream of a compile can happen without a membership, so a green macOS
# build on every pull request touching the shell proves something nobody can act on yet. Dispatch
# the workflow by hand to compile the project on demand in the meantime.
#
# To restore, uncomment the two triggers. Nothing else here changed. See T-0024.
on:
  # pull_request:
  #   paths: &ios-paths
  #     - "ios/**"
  #     - "native/**"
  #     - "capacitor.config.ts"
  #     - "package.json"
  #     - "package-lock.json"
  #     - ".github/workflows/ios.yml"
  # push:
  #   branches: [main]
  #   paths: *ios-paths
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Archive, sign and upload the build to TestFlight"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Printed rather than pinned. The Xcode that ships on the runner image moves on its own, and
      # a build that breaks after an image bump is far easier to diagnose when the log says which
      # Xcode produced it than when it has to be inferred from the date.
      - name: Record the toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Install dependencies
        run: npm ci

      # Copies the web assets into the app bundle and regenerates the Swift package manifest from
      # the installed Capacitor version.
      - name: Sync the iOS project
        run: npx cap sync ios

      # `cap sync` writes ios/App/CapApp-SPM/Package.swift, which is committed. If the Capacitor
      # dependency moved without someone re-syncing, the file on disk now differs from the file in
      # git — the same drift check the repository already applies to generated database artifacts.
      - name: Fail if the committed project drifted from what sync produces
        run: git diff --exit-code -- ios/

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -resolvePackageDependencies

      # Release rather than Debug: this is the configuration the archive below uses, so it is the
      # one worth proving compiles. Signing is switched off because this job holds no credentials.
      - name: Build
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

  testflight:
    name: Archive and upload to TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record the toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Sync the iOS project
        run: npx cap sync ios

      # xcodebuild wants the key as a file. It is written under RUNNER_TEMP, which is discarded
      # with the runner, rather than into the checkout where a later step could commit it.
      - name: Write the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      # `-allowProvisioningUpdates` with an API key is what removes the Mac from this task
      # entirely: Xcode creates the distribution certificate and the provisioning profile against
      # the developer account itself, so nobody has to generate a signing request in Keychain
      # Access and carry a .p12 around. The key needs the App Manager role for this to be allowed.
      #
      # The build number comes from the workflow run number because App Store Connect rejects a
      # build whose number it has already seen, and the number the project carries never changes.
      - name: Archive
        env:
          ASC_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ vars.APPSTORE_TEAM_ID }}
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      # Written here rather than committed: the only value in it that is not a constant is the team
      # id, and keeping that in one place — a repository variable — beats duplicating it into a
      # file that would then have to be kept in step with the account.
      - name: Write the export options
        env:
          TEAM_ID: ${{ vars.APPSTORE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          PLIST

      - name: Export the IPA
        env:
          ASC_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # `uses-non-exempt-encryption: false` is an export-compliance declaration: the app's only
      # cryptography is the HTTPS it speaks to the deployed origin, which is exempt. Without it
      # every build stalls in App Store Connect waiting to be answered by hand.
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ runner.temp }}/export/App.ipa
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          uses-non-exempt-encryption: "false"
          wait-for-processing: "true"

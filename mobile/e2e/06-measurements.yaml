# Measurements: the health tab's menu, the list by category, and a value's chart and history.
# View-only — recording and visibility editing live with the agent, not on the phone.
appId: host.exp.Exponent
name: Измерения
---
- runFlow: setup/fresh.yaml
- openLink: exp://127.0.0.1:8081/--/health
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Измерения" # The card reads as its title; the description is not its own element.
    timeout: 60000
- takeScreenshot: measurements-01-health
- tapOn: "Измерения"
- extendedWaitUntil:
    visible: "ОСНОВНЫЕ"
    timeout: 20000
- takeScreenshot: measurements-02-list
- tapOn:
    text: "Вес.*" # The card reads as one element, its texts joined.
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Динамика значений"
    timeout: 20000
- takeScreenshot: measurements-03-weight
- scrollUntilVisible:
    element: "История измерений"
- takeScreenshot: measurements-04-history
- scrollUntilVisible:
    element: ".*80.80.*"
- assertVisible: ".*80.80.*"

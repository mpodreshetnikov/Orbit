# The "Сегодня" tab: opens signed in as the seed user and shows the day's doses.
appId: host.exp.Exponent
name: Сегодня
---
- openLink: exp://127.0.0.1:8081
# Expo Go's first-run tour of its developer menu, when it shows.
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible: "Vitamin D3"
    timeout: 300000
- tapOn:
    text: "Continue"
    optional: true
- takeScreenshot: today-01-day

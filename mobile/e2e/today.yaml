# The "Сегодня" tab: opens signed in as the seed user and shows the day's doses.
appId: host.exp.Exponent
name: Сегодня
---
- openLink: exp://127.0.0.1:8081
# iOS asks before a link leaves for another app.
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Vitamin D3"
    timeout: 600000
# Expo Go's first-run tour of its developer menu, laid over the app once it has loaded.
- tapOn:
    text: "Continue"
    optional: true
- assertNotVisible: "This is the developer menu.*"
- takeScreenshot: today-01-day

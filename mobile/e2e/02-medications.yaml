# "Лекарства": the day's doses, then the course list, search, a status filter, a course and its
# history.
appId: host.exp.Exponent
name: Лекарства
---
- runFlow: setup/fresh.yaml
# Deep-link like 03/04: a bare root open + tab tap after relaunch can land before the client
# settles and leave «Сегодня» up (Mobile recordings 42823469817 — «Курсы» never appeared).
- openLink: exp://127.0.0.1:8081/--/medications
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Курсы"
    timeout: 60000
    optional: true
# Tunnel / cold-tab stall: relaunch until the segmented switch is up.
- repeat:
    times: 4
    while:
      notVisible: "Курсы"
    commands:
      - runFlow: setup/fresh.yaml
      - openLink: exp://127.0.0.1:8081/--/medications
      - tapOn:
          text: "Open"
          optional: true
      - extendedWaitUntil:
          visible: "Курсы"
          timeout: 60000
          optional: true
- extendedWaitUntil:
    visible: "Курсы"
    timeout: 60000
# The tab opens on the day's doses; the courses are the switch's other half.
- takeScreenshot: meds-00-doses
- tapOn: "Курсы"
# Same tunnel stall as 01-today: Курсы paints its filters with an empty loading list. Relaunch
# and reopen the tab until the seed course appears.
- repeat:
    times: 4
    while:
      notVisible: "Vitamin D3.*"
    commands:
      - extendedWaitUntil:
          visible: "Vitamin D3.*"
          timeout: 30000
          optional: true
      - runFlow:
          when:
            notVisible: "Vitamin D3.*"
          commands:
            - runFlow: setup/fresh.yaml
            - openLink: exp://127.0.0.1:8081/--/medications
            - tapOn:
                text: "Open"
                optional: true
            - extendedWaitUntil:
                visible: "Курсы"
                timeout: 60000
            - tapOn: "Курсы"
- extendedWaitUntil:
    visible: "Vitamin D3.*"
    timeout: 30000
- takeScreenshot: meds-01-list
# The native search bar hides under the large title until the list is pulled down.
- swipe:
    direction: DOWN
- tapOn: "Поиск"
- inputText: "Mag"
- takeScreenshot: meds-02-search
# The round close button beside the field empties the query and closes the keyboard: the next
# steps and flows need the whole list, and hiding the keyboard by a gesture can land a tap on a
# course behind it. It has no text to find it by, so it is tapped where it sits.
- tapOn:
    point: "90%,10%"
- extendedWaitUntil:
    visible: "Vitamin D3.*"
    timeout: 10000
- tapOn: "Приостановлено"
- takeScreenshot: meds-03-filter
- tapOn: "Все"
- tapOn: "Vitamin D3.*"
- extendedWaitUntil:
    visible: "Ежедневно в 08:00.*"
    timeout: 20000
- takeScreenshot: meds-04-course
# The counted row is the link; the bare "История приёмов" is the section heading above it.
- scrollUntilVisible:
    element: "История приёмов · .*"
- tapOn: "История приёмов · .*"
- extendedWaitUntil:
    notVisible: "Ежедневно в 08:00.*"
    timeout: 20000
- takeScreenshot: meds-05-history

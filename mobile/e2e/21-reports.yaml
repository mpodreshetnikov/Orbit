# The budget report, opened by its link, and a category's target.
appId: host.exp.Exponent
name: Отчеты
---
- runFlow: setup/fresh.yaml
- openLink: exp://127.0.0.1:8081/--/money/reports
- tapOn: { text: "Open", optional: true }
- extendedWaitUntil:
    visible: "(Фактические доходы|Не удалось загрузить.*)" # The rates sync needs the edge function.
    timeout: 60000
- takeScreenshot: reports-01-month
- runFlow:
    when: { visible: "Изменить цель: Food" }
    commands:
      - tapOn: "Изменить цель: Food"
      - extendedWaitUntil: { visible: "Сумма цели.*", timeout: 10000 }
      - takeScreenshot: reports-02-target
      - tapOn: "Отмена"
# The link sits at the bottom of a long report, under the tab bar: bring it to the middle first.
- scrollUntilVisible:
    element: "Псевдонимы для переводов себе"
    centerElement: true
- tapOn: "Псевдонимы для переводов себе"
- extendedWaitUntil: { visible: "Добавить", timeout: 10000 }
- takeScreenshot: reports-03-aliases

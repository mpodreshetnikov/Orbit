# The money report, opened by its link: totals and categories from the seed month (January 2026
# has amounts), then the next seeded month (February), so a period change is visible without
# depending on "today" being empty.
appId: host.exp.Exponent
name: Отчеты
---
- runFlow: setup/fresh.yaml
- openLink: exp://127.0.0.1:8081/--/money/reports
- tapOn: { text: "Open", optional: true }
- extendedWaitUntil:
    visible: "(Категории|Не удалось загрузить отчёт.)" # The rates sync needs the edge function.
    timeout: 60000
- takeScreenshot: reports-01-current-month
# Seed money lives in January/February 2026; the default month is "today" and can be empty.
# Walk back with the previous-period control until the seed month is on screen.
- repeat:
    times: 24
    while:
      notVisible: "Январь 2026.*"
    commands:
      - tapOn: "Предыдущий период"
      - extendedWaitUntil:
          visible: "Январь 2026.*|Категории|Не удалось загрузить отчёт."
          timeout: 20000
          optional: true
- extendedWaitUntil:
    visible: "Январь 2026.*"
    timeout: 30000
# Signed seed: expenses are non-empty on the Расходы treemap (parents), not absolute leaf names
# until a block is expanded. Empty state must not show.
- extendedWaitUntil:
    notVisible: "За этот период операций нет."
    timeout: 30000
- extendedWaitUntil:
    visible: "Жилье.*"
    timeout: 30000
- extendedWaitUntil:
    visible: "Еда.*"
    timeout: 15000
- takeScreenshot: reports-02-january-filled
- scrollUntilVisible:
    element: "Категории"
    centerElement: true
- takeScreenshot: reports-03-january-categories
# Treemap UX: tap the housing block (hint «Нажмите на блок…») to open its children.
- tapOn: "Жилье, .*"
- extendedWaitUntil:
    visible: "Аренда.*"
    timeout: 15000
- takeScreenshot: reports-04-category-open
# Period change: February 2026 still has seed spend (Steam / entertainment).
- tapOn: "Следующий период"
- extendedWaitUntil:
    visible: "Февраль 2026.*"
    timeout: 30000
- extendedWaitUntil:
    visible: "(Развлечения|Steam|Категории).*"
    timeout: 30000
- takeScreenshot: reports-05-february

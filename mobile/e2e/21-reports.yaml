# The money report, opened by its link: the totals, the map of categories, and a category opened.
appId: host.exp.Exponent
name: Отчеты
---
- runFlow: setup/fresh.yaml
- openLink: exp://127.0.0.1:8081/--/money/reports
- tapOn: { text: "Open", optional: true }
- extendedWaitUntil:
    visible: "(Категории|Не удалось загрузить отчёт.)" # The rates sync needs the edge function.
    timeout: 60000
- takeScreenshot: reports-01-month
- runFlow:
    when: { visible: "Категории" }
    commands:
      - scrollUntilVisible:
          element: "Категории"
          centerElement: true
      - takeScreenshot: reports-02-categories
      - runFlow:
          when: { visible: "Раскрыть «.*»" }
          commands:
            - tapOn: "Раскрыть «.*»"
            - takeScreenshot: reports-03-category-open
- tapOn: "Неделя"
- extendedWaitUntil:
    visible: "(Категории|Не удалось загрузить отчёт.)"
    timeout: 30000
- takeScreenshot: reports-04-week

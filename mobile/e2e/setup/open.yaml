# Opens the client once before anything is recorded: the first load builds the bundle and walks
# past iOS's link prompt and Expo Go's first-launch tour, which no recording needs to show.
appId: host.exp.Exponent
name: Open the client
---
- openLink: exp://127.0.0.1:8081
# iOS asks before a link leaves for another app.
- tapOn:
    text: "Open"
    optional: true
# Expo Go lays a tour of its developer menu over the app on its first launch, and nothing under
# it is visible to Maestro until it is closed: wait for whichever comes first.
- extendedWaitUntil:
    visible: "Сегодня|Continue"
    timeout: 600000
- tapOn:
    text: "Continue"
    optional: true
# "Continue" opens the developer menu itself; close it too.
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible: "Сегодня"
    timeout: 60000

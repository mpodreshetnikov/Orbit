# Documents: the health dashboard hero (search + latest docs), the full list, and the seeded blood
# test with its results. Metadata editing is gone — view and attachments only.
appId: host.exp.Exponent
name: Документы
---
- runFlow: setup/fresh.yaml
- openLink: exp://127.0.0.1:8081/--/health
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Поиск документов"
    timeout: 60000
- extendedWaitUntil:
    visible: "Annual Blood Test Results.*" # A row reads as one element: match the whole of it.
    timeout: 60000
- assertVisible: "Диагнозы"
- assertVisible: "Находки"
- assertVisible: "Чек-апы"
- assertVisible: "Анализы и измерения"
- takeScreenshot: documents-01-health
- tapOn: "Все документы"
- extendedWaitUntil:
    visible: "Все типы"
    timeout: 20000
- takeScreenshot: documents-02-list
- tapOn:
    text: "Annual Blood Test Results.*"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Заметки"
    timeout: 20000
- takeScreenshot: documents-03-record
- assertVisible: "Заметки"

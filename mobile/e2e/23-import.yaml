# A statement import opened by its link: the file picker, the history and a batch waiting for review.
appId: host.exp.Exponent
name: Импорт
---
- runFlow: setup/fresh.yaml
- openLink: exp://127.0.0.1:8081/--/money/import
- tapOn: { text: "Open", optional: true }
- extendedWaitUntil:
    visible: "История импортов"
    timeout: 60000
- takeScreenshot: import-01-start
# The file card sits under the bank and the way in: bring its drop area on screen, then open it.
# The area is one button, so its label runs on into the hint under the title.
- scrollUntilVisible:
    element: "Выберите файл выписки.*"
    direction: DOWN
- takeScreenshot: import-01-file
- tapOn: "Выберите файл выписки.*"
- extendedWaitUntil: { visible: "(Cancel|Отменить|Отмена)", timeout: 15000 }
- takeScreenshot: import-02-picker
# The picker can take the first Cancel while it is still settling and stay open: cancel again while
# it is on view, and wait for the screen underneath.
- waitForAnimationToEnd
- tapOn: "(Cancel|Отменить|Отмена)"
- runFlow:
    when:
      visible: "Recents"
    commands:
      - tapOn: "(Cancel|Отменить|Отмена)"
- scrollUntilVisible:
    element: "История импортов"
    direction: UP
- tapOn: "История импортов"
- extendedWaitUntil: { visible: ".*tbank · Файл.*", timeout: 10000 }
- takeScreenshot: import-03-history
- tapOn: ".*tbank · Файл.*"
- extendedWaitUntil: { visible: "Применить пакет", timeout: 10000 }
- takeScreenshot: import-04-report

# Checkups: «Чек-апы» opened by its link, grouped by when they are due, then marked done with a note.
# Planning the next date is an agent job — the phone only completes.
appId: host.exp.Exponent
name: Чек-апы
---
- runFlow: setup/fresh.yaml
- openLink: exp://127.0.0.1:8081/--/health/checkups
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Отметить выполненным"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: checkups-01-list
- tapOn:
    text: "Отметить выполненным"
    index: 0
- extendedWaitUntil:
    visible: "Дата выполнения"
    timeout: 10000
- tapOn:
    id: "completion-note"
# A fresh simulator shows the slide-to-type tip over its first keyboard.
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    id: "completion-note"
- inputText: "Сдал натощак"
- hideKeyboard
- takeScreenshot: checkups-02-complete
- tapOn: "Сохранить"
- extendedWaitUntil:
    notVisible: "Дата выполнения"
    timeout: 20000
- takeScreenshot: checkups-03-done

# A seeded spend opened from the money feed and read view-only — no create, edit or delete on the phone.
appId: host.exp.Exponent
name: Транзакция
---
- runFlow: setup/fresh.yaml
- openLink: exp://127.0.0.1:8081/--/money
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Совпадений"
    timeout: 60000
- extendedWaitUntil:
    visible: "Steam.*"
    timeout: 30000
- takeScreenshot: transaction-01-feed
- tapOn:
    text: "Steam.*"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Строки"
    timeout: 20000
- takeScreenshot: transaction-02-page
- assertVisible: "Строки"

# A new checkup from the list's "+": a yearly one starting in winter, saved and back on the list.
appId: host.exp.Exponent
name: Новый чек-ап
---
- openLink: exp://127.0.0.1:8081/--/health/checkups
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Annual blood work"
    timeout: 60000
- tapOn: "Добавить чек-ап"
- extendedWaitUntil:
    visible: "Расписание"
    timeout: 20000
- tapOn:
    id: "checkup-title"
- inputText: "Осмотр окулиста"
- tapOn: "Частота: Каждые 6 мес."
- tapOn: "Каждый год"
- tapOn: "Первый срок: От сегодня"
- tapOn: "Зима (1 декабря)"
- takeScreenshot: checkup-form-01-filled
- tapOn: "Сохранить"
- extendedWaitUntil:
    visible: "Осмотр окулиста"
    timeout: 20000
- takeScreenshot: checkup-form-02-saved

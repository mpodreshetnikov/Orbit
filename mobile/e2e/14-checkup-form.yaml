# A new checkup from the list's "+": a yearly one starting in winter, saved and back on the list.
appId: host.exp.Exponent
name: Новый чек-ап
---
- runFlow: setup/fresh.yaml
- openLink: exp://127.0.0.1:8081/--/health/checkups
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: ".*Annual blood work.*"
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    text: "Добавить чек-ап"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Расписание"
    timeout: 20000
- tapOn:
    id: "checkup-title"
- inputText: "Осмотр окулиста"
# The first tap past an open keyboard only closes it.
- hideKeyboard
- tapOn: "Частота: Каждые 6 мес."
- tapOn: "Каждый год"
- tapOn: "Первый срок: От сегодня"
- tapOn: "Зима (1 декабря)"
- takeScreenshot: checkup-form-01-filled
- tapOn: "Сохранить"
# The title field holds the same words: wait for the form to close first.
- extendedWaitUntil:
    notVisible: "Частота: .*"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*Осмотр окулиста.*"
    timeout: 20000
- takeScreenshot: checkup-form-02-saved

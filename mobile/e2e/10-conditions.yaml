# Conditions: «Диагнозы» opened by its link, by status with the status guide opened, and the seeded
# hypertension with its mentions — view-only (edit/history forms are agent-side).
appId: host.exp.Exponent
name: Диагнозы
---
- runFlow: setup/fresh.yaml
- openLink: exp://127.0.0.1:8081/--/health/conditions
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Активные диагнозы.*"
    timeout: 60000
- tapOn: "Справка по статусам"
- takeScreenshot: conditions-01-list
- tapOn: "Справка по статусам"
- tapOn:
    text: "Essential hypertension.*"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "История упоминаний"
    timeout: 20000
- takeScreenshot: conditions-02-hypertension
- assertVisible: "История упоминаний"

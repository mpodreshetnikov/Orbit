# The money tab: the seeded transactions by day with their sums, then only the money that came in.
appId: host.exp.Exponent
name: Деньги
---
- runFlow: setup/fresh.yaml
- openLink: exp://127.0.0.1:8081/--/money
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Совпадений"
    timeout: 60000
# The sums' heading shows before the feed arrives: wait for a seeded transaction too. A row reads as
# one element, the merchant first.
- extendedWaitUntil:
    visible: "Steam.*"
    timeout: 30000
- takeScreenshot: money-01-feed
- tapOn:
    text: "Доходы"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Employer LLC.*"
    timeout: 20000
- takeScreenshot: money-02-income

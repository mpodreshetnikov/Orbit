# The money tab: the seeded transactions by day with their sums, one line per currency, then only
# the money that came in.
appId: host.exp.Exponent
name: Деньги
---
- runFlow: setup/fresh.yaml
- openLink: exp://127.0.0.1:8081/--/money
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Совпадений"
    timeout: 60000
# The sums' heading shows before the feed arrives: wait for a seeded transaction too. A row reads as
# one element, the merchant first.
- extendedWaitUntil:
    visible: "Steam.*"
    timeout: 30000
# The workflow adds one dollar spend: the sums keep it apart from the rubles.
- extendedWaitUntil:
    visible: "-12,50.*"
    timeout: 20000
# Signed seed expense totals stay negative in the summary (Jan+Feb RUB outflows).
- extendedWaitUntil:
    visible: "-60.*"
    timeout: 10000
- takeScreenshot: money-01-feed
# On a938a85 CI this pass; on 7eef967 the Доходы chip tap completed while «Все» stayed selected
# (screenshot), so Employer LLC stayed below the fold. Retap until the income row is on screen.
- repeat:
    times: 4
    while:
      notVisible: "Employer LLC.*"
    commands:
      - tapOn:
          text: "Доходы"
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible: "Employer LLC.*"
          timeout: 20000
          optional: true
- extendedWaitUntil:
    visible: "Employer LLC.*"
    timeout: 30000
# Income side of the signed seed (January salary).
- extendedWaitUntil:
    visible: "180.*"
    timeout: 10000
- takeScreenshot: money-02-income

# The "Сегодня" tab: opens signed in as the seed user and shows the day's blocks, doses still to
# take and the late or coming checkups.
# `setup/open.yaml` has already loaded the client; `setup/fresh.yaml` relaunches it on «Сегодня».
appId: host.exp.Exponent
name: Сегодня
---
- runFlow: setup/fresh.yaml
# The link names the screen, as every flow's does: a tap on the tab right after a launch can land
# before the client has settled and be lost.
- openLink: exp://127.0.0.1:8081/--/today
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Сегодня"
    timeout: 60000
# A quick tunnel can stall the first PostgREST queries after open the same way it stalls
# sign-in: the screen paints with empty loading blocks and the seed dose never arrives. Tap
# the tab once, then relaunch until Vitamin D3 shows — later flows in the same job already
# recover once the tunnel settles.
- repeat:
    times: 4
    while:
      notVisible: "Vitamin D3.*"
    commands:
      - tapOn: "Сегодня"
      - extendedWaitUntil:
          visible: "Vitamin D3.*"
          timeout: 30000
          optional: true
      - runFlow:
          when:
            notVisible: "Vitamin D3.*"
          commands:
            - runFlow: setup/fresh.yaml
            - openLink: exp://127.0.0.1:8081/--/today
            - tapOn:
                text: "Open"
                optional: true
            - extendedWaitUntil:
                visible: "Сегодня"
                timeout: 60000
# A dose row reads as one element, "Vitamin D3, Просрочено · …": Maestro matches the whole text.
- extendedWaitUntil:
    visible: "Vitamin D3.*"
    timeout: 60000
- takeScreenshot: today-01-day
- extendedWaitUntil:
    visible: "Чек-апы"
    timeout: 20000
- takeScreenshot: today-02-blocks

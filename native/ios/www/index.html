<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Orbit is offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #111111;
        --muted: #5f5f5f;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b0b;
          --fg: #f5f5f5;
          --muted: #a1a1a1;
        }
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem calc(2rem + env(safe-area-inset-left)) 2rem
          calc(2rem + env(safe-area-inset-right));
        background: var(--bg);
        color: var(--fg);
        font: 1rem/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      main {
        max-width: 22rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
        font-weight: 600;
      }

      p {
        margin: 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <!--
      The only page shipped inside the app bundle. Capacitor requires the web assets directory to
      hold an index.html, and `server.errorPath` points back here, so this is what a user sees when
      the deployed web app cannot be reached — not a blank white web view.
    -->
    <main>
      <h1>Orbit can’t be reached</h1>
      <p>Check your connection and open the app again.</p>
    </main>
  </body>
</html>
